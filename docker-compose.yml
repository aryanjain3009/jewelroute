# Local full stack: Postgres 16 + API + web.   docker compose up --build
# Then seed once: docker compose exec api npx tsx prisma/seed.ts
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jewelroute
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/jewelroute
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@db:5432/jewelroute
      JWT_ACCESS_SECRET: dev-access-secret-change-me-0123456789
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-0123456789
      APP_SECRET: dev-app-secret-change-me-0123456789
      CRON_SECRET: dev-cron-secret
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_PUBLIC_URL: http://localhost:3000
      API_PUBLIC_URL: http://api:4000
      CORS_ORIGINS: http://localhost:3000
    ports: ["4000:4000"]

  web:
    image: node:22-bookworm-slim
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jewelroute/shared build && pnpm --filter @jewelroute/web dev"
    environment:
      API_ORIGIN: http://api:4000
    volumes: [".:/repo", "/repo/node_modules"]
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
