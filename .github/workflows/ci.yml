name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: jewelroute_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jewelroute_test
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/jewelroute_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jewelroute_test
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
      APP_SECRET: ci-app-secret-0123456789abcdef
      CRON_SECRET: ci-cron-secret
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_PUBLIC_URL: http://localhost:3000
      API_PUBLIC_URL: http://127.0.0.1:4107
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jewelroute/shared build
      - run: pnpm --filter @jewelroute/shared test
      - run: pnpm --filter @jewelroute/api typecheck
      - run: pnpm --filter @jewelroute/api build
      - name: prisma migrate deploy
        run: pnpm --filter @jewelroute/api exec prisma migrate deploy
      - name: integration tests
        run: pnpm --filter @jewelroute/api test
      - name: 26-step end-to-end scenario
        working-directory: apps/api
        run: |
          export DATABASE_URL=$TEST_DATABASE_URL PORT=4000 API_PUBLIC_URL=http://127.0.0.1:4000
          npx tsx prisma/seed.ts
          node dist/main.js & sleep 4
          BASE_URL=http://127.0.0.1:4000 npx tsx scripts/e2e-smoke.ts
